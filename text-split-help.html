<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEXT SPLIT ヘルプ</title>
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 20px; color: #242424; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
    h1 { font-size: 26px; }
    h2 { margin-top: 30px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>TEXT SPLIT</h1>
  <p>1つのテキストボックスを、改行または空行の位置で複数のテキストボックスに分けます。</p>
  <h2>A 改行ごとにバラす</h2>
  <p>文字が入った各行を、それぞれ独立したテキストボックスへ変換します。空行の位置は間隔として残します。</p>
  <h2>B 空行ごとにバラす</h2>
  <p>空の行を区切りとして、前後の文章ブロックを独立したテキストボックスへ変換します。</p>
  <h2>使い方</h2>
  <ol>
    <li>スライド上のテキストボックスを1個選択します。</li>
    <li>タスクペインでAまたはBを押します。</li>
    <li>必要に応じてPowerPointの「元に戻す」で復元します。</li>
  </ol>
</body>
</html>
