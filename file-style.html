<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ファイルの色・フォント</title><link rel="stylesheet" href="file-style.css?v=1.6.3"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer src="file-style-core.js?v=1.6.3"></script><script defer src="file-style.js?v=1.6.3"></script></head>
<body><main><header><span class="mark">Aa</span><h1>色・フォント登録</h1></header>
<div id="status" role="status" aria-live="polite">接続中…</div>

<section><h2>カラー</h2>
<button id="capture-color" class="primary" disabled>選択オブジェクトの色を登録</button>

<form id="color-form"><label for="color-name">色の名前（任意）</label><input id="color-name" maxlength="60" placeholder="メインカラー"><div class="row"><input id="picker" type="color" value="#2155CD" aria-label="色を選ぶ"><input id="hex" value="#2155CD" maxlength="7" aria-label="カラーコード"><button type="submit" disabled>追加</button></div></form>
<div id="colors" class="list"></div></section>
<section><h2>フォント</h2><button id="capture-font" class="primary" disabled>選択テキストのフォントを登録</button>
<form id="font-form"><label for="font-name">フォント名</label><input id="font-name" maxlength="120" placeholder="例：游ゴシック"><label for="font-label">表示名（任意）</label><div class="row"><input id="font-label" maxlength="60" placeholder="本文用"><button type="submit" disabled>追加</button></div></form><div id="fonts" class="list"></div></section>
<section><h2>フォントサイズ</h2><form id="size-form"><label for="font-size">サイズ（pt）</label><div class="row"><input id="font-size" type="number" min="1" max="400" step="any" inputmode="decimal" placeholder="例：24" required><button type="submit" disabled>追加</button></div></form><button id="capture-size" class="primary" disabled>選択テキストのサイズを登録</button><div id="sizes" class="list size-list"></div></section>
<section class="storage"><h2>保存</h2><p id="capacity">登録データ：0 KB</p><p class="hint">閉じる前に ⌘S</p><button id="reload" disabled>再読み込み</button></section>
<section><h2>スタイルの移行</h2><button id="export-styles" class="primary" disabled>書き出す</button><button id="import-styles" class="primary" disabled>読み込む</button><input id="import-file" type="file" accept=".json,application/json" hidden>
<div id="export-result" hidden><a id="download-styles" class="download-link">設定ファイルを保存</a><details><summary>設定テキストをコピー</summary><label for="export-json">設定テキスト</label><textarea id="export-json" readonly rows="6" spellcheck="false"></textarea></details></div>
<details><summary>設定テキストから読み込む</summary><label for="import-json">設定テキスト</label><textarea id="import-json" rows="6" spellcheck="false" placeholder="設定テキストを貼り付け"></textarea><button id="import-text" disabled>読み込む</button></details></section>
<footer>FILE STYLE · 1.6.3</footer></main></body></html>
