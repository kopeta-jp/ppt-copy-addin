<head>

  <title>SHAPE CONVERTER ヘルプ</title>
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 20px; color: #242424; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }

    h2 { margin-top: 30px; font-size: 18px; }

<body>
  <h1>SHAPE CONVERTER</h1>
  <p>正方形・長方形と角丸四角形を相互変換するPowerPointアドインです。</p>
  <h2>使い方</h2>
  <ol>
    <li>変換する図形を1個選択します。</li>
    <li>タスクペインで変換方向を選択します。</li>
    <li>必要に応じてPowerPointの「元に戻す」で復元します。</li>
  </ol>
  <h2>対応する書式</h2>
  <p>単色または塗りなし、枠線、位置、サイズ、回転、重なり順、テキストと主要な文字書式を引き継ぎます。</p>
</body>
