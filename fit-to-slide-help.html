<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIT TO SLIDE ヘルプ</title>
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 20px; color: #242424; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
    h1 { font-size: 26px; }
    h2 { margin-top: 30px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>FIT TO SLIDE</h1>
  <p>選択した画像・図形を、現在のスライドと同じ幅・高さに変更するPowerPointアドインです。</p>
  <h2>使い方</h2>
  <ol>
    <li>スライド上で画像または図形を選択します。</li>
    <li>複数の場合は、Shiftキーを押しながら追加選択します。</li>
    <li>タスクペインで「スライド全面に合わせる」を押します。</li>
  </ol>
  <h2>変更内容</h2>
  <p>選択したオブジェクトの左位置と上位置を0 ptにし、幅と高さをスライドと同じ寸法へ変更します。</p>
</body>
</html>
