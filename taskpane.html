<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://appsforoffice.microsoft.com; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self'; img-src 'self' data: blob:; connect-src 'self';">
  <title>PPT COPY</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand-mark" aria-hidden="true">P</div>
      <div>
        <h1>PPT COPY</h1>
        <p class="subtitle">スライドを高画質PNGでコピー</p>
      </div>
    </header>

    <section class="card action-card" aria-labelledby="copy-title">
      <h2 id="copy-title">選択中の1枚</h2>
      <p>横幅 <strong>2560 px</strong>、縦横比はそのままです。</p>
      <button id="copy-slide" class="primary" type="button" disabled>
        <span class="button-label">画像としてコピー</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <div id="status" class="status neutral" role="status" aria-live="polite">
        PowerPointに接続しています…
      </div>
    </section>

    <section id="fallback" class="card fallback hidden" aria-labelledby="fallback-title">
      <h2 id="fallback-title">生成した画像</h2>
      <p id="fallback-note">直接コピーできない場合は、もう一度コピー、右クリック、または保存を利用できます。</p>
      <div class="preview-wrap">
        <img id="preview" alt="生成したスライドのプレビュー">
      </div>
      <div class="button-row">
        <button id="retry-copy" class="secondary" type="button">もう一度コピー</button>
        <a id="download" class="secondary link-button" download="slide.png">PNGを保存</a>
      </div>
      <p class="hint">画像上で右クリックしてコピーできる場合もあります。</p>
    </section>

    <details class="help">
      <summary>うまくいかないとき</summary>
      <ul>
        <li>左側の一覧で、スライドを1枚だけ選択します。</li>
        <li>Macの確認画面が出たら、クリップボードへのアクセスを許可します。</li>
        <li>直接コピーが拒否されたら、表示された画像を保存して利用します。</li>
      </ul>
    </details>
  </main>
</body>
</html>
