<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPTX EXPORT ヘルプ</title>
  <link rel="stylesheet" href="pptx-export.css">
</head>
<body>
  <main class="shell">
    <header><div class="brand-mark">X</div><div><h1>PPTX EXPORT</h1><p class="subtitle">ヘルプ</p></div></header>
    <section class="card">
      <h2>使い方</h2>
      <p>左側のスライド一覧で必要なスライドを選択し、「選択スライドを保存」を押します。複数枚は⌘キーまたはShiftキーを押しながら選択してください。</p>
      <p>選択したスライドは元資料内の順番で、1つの編集可能なPPTXに保存されます。元資料は変更されません。</p>
    </section>
  </main>
</body>
</html>
