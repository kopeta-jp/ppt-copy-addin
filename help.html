<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT COPY ヘルプ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header><div class="brand-mark">P</div><div><h1>PPT COPY</h1><p class="subtitle">ヘルプ</p></div></header>
    <section class="card">
      <h2>使い方</h2>
      <p>PowerPointの左側でスライドを1枚選択し、ホームタブの「画像としてコピー」を開きます。タスクペインのボタンを押すと横2560pxのPNGを生成します。</p>
      <p>直接コピーできない場合は、プレビューの「もう一度コピー」か「PNGを保存」を利用してください。</p>
    </section>
  </main>
</body>
</html>
